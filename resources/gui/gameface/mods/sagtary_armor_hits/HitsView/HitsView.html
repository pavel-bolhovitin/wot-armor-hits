<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <!-- The hits screen. The page is transparent and covers the whole screen, so the 3D hangar shows through it.
             The lobby draws the page header (the hangar button, the title, the wallet) and the footer over it.
             The panels follow the design of the "Armor Hits Core" artifact. -->
        <title>Armor Hits</title>
        <link rel="stylesheet" href="HitsView.css" />
    </head>
    <body>
        <div class="hitsView">
            <!-- Mouse over the 3D scene: drags turn the camera, the wheel zooms (HitsView.js). -->
            <div class="sceneInput"></div>
            <div class="hitsView__content">
                <!-- Settings: the gear right of the battle selector opens the menu of the mod's settings below it,
                     each on or off, and the file buttons (HitsView.js). -->
                <div class="settingsButton">
                    <div class="settingsButton__icon"></div>
                    <div class="settingsMenu">
                        <div class="settingsMenu__title"></div>
                        <div class="settingsMenu__items"></div>
                        <!-- How the battles of each group of modes are kept: a row a group, its name and three
                             choices: off, for the session, in files too (HitsView.js). -->
                        <div class="settingsMenu__modes">
                            <div class="settingsMenu__modesTitle"></div>
                            <div class="settingsMenu__modeRows"></div>
                        </div>
                        <!-- File buttons under the settings: save the chosen battle to its file (a disk), delete all the
                             battles (a bin; the question and its two choices in its place first); an icon and a label
                             each (HitsView.js). -->
                        <div class="fileButtons">
                            <div class="fileButtons__button fileButtons__save">
                                <div class="fileButtons__icon">
                                    <div class="fileButtons__disk"></div>
                                    <div class="fileButtons__diskShutter"></div>
                                    <div class="fileButtons__diskLabel"></div>
                                </div>
                                <div class="fileButtons__label fileButtons__saveLabel"></div>
                            </div>
                            <div class="fileButtons__button fileButtons__delete">
                                <div class="fileButtons__icon">
                                    <div class="fileButtons__binLid"></div>
                                    <div class="fileButtons__binHandle"></div>
                                    <div class="fileButtons__binBody"></div>
                                </div>
                                <div class="fileButtons__label fileButtons__deleteLabel"></div>
                            </div>
                            <div class="fileButtons__confirm">
                                <div class="fileButtons__confirmText"></div>
                                <div class="fileButtons__choices">
                                    <div class="fileButtons__choice fileButtons__choiceDelete"></div>
                                    <div class="fileButtons__choice fileButtons__choiceCancel"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- The note at the top of the screen: the selected battle is from a file of an old format (HitsView.js). -->
                <div class="oldFormatAlert"><div class="oldFormatAlert__text"></div></div>
                <div class="hitsView__left">
                    <!-- Battle selector: the selected battle and the list of the session's battles (HitsView.js). -->
                    <div class="battleSelector battleSelector__empty">
                        <div class="battleSelector__card">
                            <div class="battleSelector__mapImage"></div>
                            <div class="battleSelector__info">
                                <div class="battleSelector__titleRow">
                                    <div class="battleSelector__mapName"></div>
                                    <div class="battleSelector__result"></div>
                                </div>
                                <div class="battleSelector__line battleSelector__vehicle"></div>
                            </div>
                            <div class="battleSelector__time"></div>
                            <div class="battleSelector__arrow"></div>
                        </div>
                        <!-- The battles grouped by day: a day row, then its battles; a scroll view (HitsView.js). -->
                        <div class="battleSelector__list scrollView">
                            <div class="scrollView__content">
                                <div class="battleSelector__items"></div>
                            </div>
                        </div>
                    </div>
                    <!-- Hits panel: the hits of the selected battle on the player's vehicle or by the player (HitsView.js). -->
                    <div class="hitsPanel">
                        <div class="hitsPanel__tabs">
                            <div class="hitsPanel__tab" data-side="received"></div>
                            <div class="hitsPanel__tab" data-side="dealt"></div>
                        </div>
                        <div class="hitsPanel__chips hitsPanel__filters"></div>
                        <div class="hitsPanel__nav">
                            <div class="hitsPanel__position"></div>
                            <div class="hitsPanel__step hitsPanel__prev"></div>
                            <div class="hitsPanel__step hitsPanel__next"></div>
                        </div>
                        <div class="hitsPanel__list scrollView">
                            <div class="scrollView__content">
                                <div class="hitsPanel__items"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="hitsView__right">
                    <!-- Overlay panel: the armor overlay type, like the client's armor page (HitsView.js). -->
                    <div class="overlayPanel">
                        <div class="overlayPanel__title"></div>
                        <div class="overlayPanel__dropdown">
                            <div class="overlayPanel__trigger">
                                <div class="overlayPanel__selected"></div>
                                <div class="overlayPanel__arrow"></div>
                            </div>
                            <div class="overlayPanel__list"></div>
                        </div>
                    </div>
                    <!-- Shot panel: the chosen hit's shooter and target and its numbers (HitsView.js). -->
                    <div class="shotPanel">
                        <div class="shotPanel__vehicles"></div>
                        <div class="shotPanel__sections"></div>
                    </div>
                </div>
                <!-- Scene panel: two groups under their titles: the lines (all the shown hits' or the chosen hit's;
                     hidden on the dealt side), the camera (the shooter view, the reset) (HitsView.js). -->
                <div class="scenePanel">
                    <div class="scenePanel__group scenePanel__lines">
                        <div class="scenePanel__title scenePanel__linesTitle"></div>
                        <div class="scenePanel__row">
                            <div class="scenePanel__check scenePanel__allLines">
                                <div class="scenePanel__box"><div class="scenePanel__tick"></div></div>
                                <div class="scenePanel__label scenePanel__allLabel"></div>
                            </div>
                        </div>
                    </div>
                    <div class="scenePanel__group scenePanel__camera">
                        <div class="scenePanel__title scenePanel__cameraTitle"></div>
                        <div class="scenePanel__row">
                            <div class="scenePanel__check scenePanel__shooter">
                                <div class="scenePanel__box"><div class="scenePanel__tick"></div></div>
                                <div class="scenePanel__label scenePanel__shooterLabel"></div>
                            </div>
                            <div class="scenePanel__divider"></div>
                            <!-- Reset: the camera back to its start, or behind the shell with the shooter view on. -->
                            <div class="scenePanel__reset">
                                <div class="scenePanel__resetIcon">
                                    <div class="scenePanel__resetArc"></div>
                                    <div class="scenePanel__resetHead"></div>
                                </div>
                                <div class="scenePanel__label scenePanel__resetLabel"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script type="module" src="HitsView.js"></script>
    </body>
</html>
